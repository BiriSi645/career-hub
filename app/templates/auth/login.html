{% extends 'base.html' %}

{% block title %}
  Sign in · Career Hub
{% endblock %}

{% block content %}
  <div class="container py-5">
    <div class="card p-4 mx-auto" style="max-width:480px">
      <h2 class="section-title">Welcome back</h2>
      <p class="text-muted">Continue your career journey.</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <label class="form-label">Email</label>
        <input class="form-control mb-3" type="email" name="email" required autofocus />
        <label class="form-label">Password</label>
        <input class="form-control mb-3" type="password" name="password" required />
        <label class="mb-3"> <input type="checkbox" name="remember" /> Remember me</label>
        <button class="btn btn-teal w-100">Sign in</button>
      </form>
    </div>
  </div>
{% endblock %}
